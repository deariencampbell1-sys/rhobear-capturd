[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capturd"
version = "0.2.0"
description = "RHOBEAR Captur'd — post-work product capture. Rested-state stills + agent-made walkthrough demos with voice-synced zoom, live DOM fidelity, and an MCP surface any RHOBEAR agent can drive."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SunSponge LLC" }]
keywords = [
    "screenshot", "playwright", "website", "responsive", "qa", "capture",
    "visual-regression", "product-demo", "walkthrough", "interactive-demo",
    "supademo-alternative", "screen-studio-alternative", "mcp"
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "playwright>=1.40",
    "openai>=1.30",
    "fastmcp>=0.4",
    "edge-tts>=6.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Voice input — push-to-talk while watching the agent walk the flow.
# faster-whisper is CT2-backed (~5x openai-whisper) and offline-capable.
# Pull only when you actually want voice mode; ~500MB of native deps.
voice = ["faster-whisper>=1.0", "sounddevice>=0.4", "miniaudio>=1.60"]
# Development / test dependencies. Everything the collected test suite needs
# is declared here so a fresh clone reproduces the green run from committed
# setup alone (no hand-set PYTHONPATH, no undeclared installs):
#
#   python -m pip install -e ".[dev]"
#   python -m playwright install chromium
#   python -m playwright install chrome
#   # plus ffmpeg/ffprobe on PATH (apt install ffmpeg / choco install ffmpeg)
#
# `playwright install chrome` is required for the full suite: three
# tests/test_recorder_agent.py content-mode tests launch channel="chrome".
# Expected skips in a clean Linux run: the gateway-key LLM test, the Postgres
# integration test, and the voice-loop fixture test (miniaudio — installed
# only via the `voice` extra above), plus the two Windows-only finisher path
# tests (they run on Windows, where the two POSIX ones skip instead).
#
# fastapi/uvicorn: the hosted service surfaces under test (tests/
# test_service_billing_caps.py, tests/test_sqlite_migrate_tool.py) import the
# FastAPI app. numpy: imported unguarded by tests/test_voice_loop.py and
# tests/test_workflow_mode.py. cryptography: the Ed25519 license-verification
# tests in tests/test_pro_env_config.py exercise real key material.
# miniaudio/faster-whisper/sounddevice are deliberately NOT here — installing
# them changes the expected skip count (they belong to `voice`).
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.23",
    "numpy>=1.26",
    "cryptography>=42",
]
all = ["faster-whisper>=1.0", "sounddevice>=0.4", "miniaudio>=1.60", "pytest>=7", "pytest-asyncio>=0.21", "fastapi>=0.110", "uvicorn[standard]>=0.23", "numpy>=1.26", "cryptography>=42"]

[project.scripts]
# New top-level dispatcher: `capturd shots ...` | `capturd walk ...` | `capturd serve`
capturd = "capturd.cli:main"
# Legacy alias so existing users' scripts don't break — points at the shots CLI directly
sunsponge-capture = "capturd.shots.cli:main"

[project.urls]
Homepage = "https://github.com/rhobear-ai/rhobear-capturd"
Source = "https://github.com/rhobear-ai/rhobear-capturd"
Issues = "https://github.com/rhobear-ai/rhobear-capturd/issues"

[tool.setuptools]
packages = ["capturd", "capturd.shots", "capturd.walk", "capturd.mcp"]

[tool.setuptools.package-data]
"capturd.walk" = ["templates/*.html"]

[tool.pytest.ini_options]
# e2e tests need network + browser + a configured AI gateway; run them
# explicitly with `pytest -m e2e`.
addopts = "-m 'not e2e'"
# Import discovery without hand-set PYTHONPATH: `scripts` holds the e2e
# harness modules (e2e_mcp_stdio / e2e_walkthrough_proof, imported by tests
# and by director-rig/film.py), `director-rig` holds the rig modules its own
# tests import. `python -m pytest -q` then collects and passes with no
# environment variables set (pytest >= 7 supports the pythonpath ini).
pythonpath = ["scripts", "director-rig"]
markers = [
    "slow: marks tests as slow (browser-dependent, skipped by default)",
    "e2e: marks end-to-end proof tests (network + browser + AI pipeline — deselected by default)",
]
