    <title>Board — two controls</title>

  <body>
    <h1>Board</h1>
    <p>
      Fixture page for the map-driven capture seam: exactly two controls, each
      wired to the UI call its pathway names, so a pathway map that names the
      call can bind to the control and take the planner's selector for it.
    </p>

    <button id="send-control" type="button" data-target="/api/control">Send Control</button>
  </body>
