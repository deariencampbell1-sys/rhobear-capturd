<!doctype html><html><head><style>
body { background:#11131a; color:#e8eaed; font-family: 'Segoe UI', sans-serif;
       display:grid; place-items:center; height:100vh; margin:0; }
.card { background:#1a1d24; border:1px solid rgba(151,183,196,.25); border-radius:16px;
        padding:36px 48px; min-width:520px; }
h1 { font-size:1.2rem; color:#9db0bb; font-weight:600; margin:0 0 18px; }
.row { display:flex; justify-content:space-between; gap:40px; padding:9px 0;
       border-bottom:1px solid rgba(255,255,255,.07); font-size:1.02rem; }
.k { color:#9db0bb; } .v { font-weight:700; }
.score { font-size:2rem; color:#f2c230; }
.badge { background:rgba(242,194,48,.15); color:#f2c230; border-radius:999px;
         padding:3px 12px; font-size:.85rem; margin-left:8px; }
</style></head><body><div class="card">
<h1>Frontman — ranked leads (owner view)</h1>
<div class="row"><span class="k">Prospect</span><span class="v">Test Prospect</span></div>
<div class="row"><span class="k">Interest score</span><span class="v score">30.0</span></div>
<div class="row"><span class="k">Demo opens</span><span class="v">3</span></div>
<div class="row"><span class="k">Engagement taps</span><span class="v">4</span></div>
<div class="row"><span class="k">Actions</span><span class="v">demo-branch demo-cta demo-complete</span></div>
<div class="row"><span class="k">Last seen</span><span class="v">2026-08-30 09:01</span></div>
</div></body></html>
